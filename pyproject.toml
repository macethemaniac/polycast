[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "polycast"
version = "0.1.0"
description = "Cryptocurrency and Prediction Market Arbitrage Scanner with Telegram Bot"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Polycast Team"}
]
keywords = ["arbitrage", "cryptocurrency", "prediction-markets", "telegram-bot", "polymarket", "kalshi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0,<3.0.0",
    "python-telegram-bot>=20.0,<21.0",
    "ccxt>=4.4.0,<5.0.0",
    "rapidfuzz>=3.0.0,<4.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/polycast"
Repository = "https://github.com/yourusername/polycast"

[project.scripts]
polycast-bot = "polycast.bot:main"
polycast-scan = "polycast.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polycast = ["data/*.json"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
