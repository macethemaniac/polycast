services:
  # Background Worker for the Telegram Bot
  - type: worker
    name: polycast-bot
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python src/polycast/bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: KALSHI_API_KEY
        sync: false
      - key: KALSHI_API_SECRET
        sync: false
      - key: POLYMARKET_API_KEY
        sync: false
      - key: POLYMARKET_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ARBITRAGE_THRESHOLD
        value: "0.5"
      - key: API_RATE_LIMIT
        value: "60"
      - key: PYTHONPATH
        value: /opt/render/project/src
    healthCheckPath: /
    autoDeploy: true
